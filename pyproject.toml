[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorlinx-desktop"
version = "1.0.0"
description = "Cross-platform (Windows & Linux) desktop application for HBX Controls / SensorLinx home heating and cooling systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SensorLinx Desktop Contributors" }
]
dependencies = [
    "pysensorlinx>=0.5.3",
    "PySide6>=6.7.0",
    "qasync>=0.27.1",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.4.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
sensorlinx-desktop = "sensorlinx_desktop.main:main"

[project.gui-scripts]
sensorlinx-gui = "sensorlinx_desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sensorlinx_desktop = ["assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
